questions:
  - id: hybrid-search-choice-1
    topicId: hybrid-search
    type: choice
    difficulty: intermediate
    prompt: 混合检索在合并之前，两路各自做什么？
    options:
      - id: a
        text: 关键词和向量各取一份已排序的候选，再合并成一份名单
      - id: b
        text: 把两路分数乘上一对固定比例再相加，这对比例适用于任何资料
      - id: c
        text: 只用向量相似度排序，关键词只负责在结果里高亮
      - id: d
        text: 把整个资料库交给重排模型，一次排完
    answer: a
    explanation: 混合检索先保留关键词和向量各自的候选，再合成一份名单。比例没有放之四海的一对数字。只用向量会漏掉必须原样匹配的词。把整个库交给重排，就不再是两路召回再合并。
  - id: hybrid-search-short-1
    topicId: hybrid-search
    type: short
    difficulty: intermediate
    prompt: 为什么不给混合检索一个通用的最佳权重？合并结果里至少要留下什么？
    reference: 关键词和向量谁更重要，取决于问题和文档。一对比例在一套资料上合适，换一套资料可能漏掉编号，或漏掉换了说法的句子。本页的合并不接收权重。结果里要留下原文，以及这条来自哪一路。接到真实检索时还要保留来源和位置。
    rubric:
      - 说明权重取决于自己的问题和文档
      - 没有把某一对比例说成普遍正确
      - 说明合并结果要留下原文
      - 提到要能看出命中来自哪一路，或要保留来源和位置
  - id: hybrid-search-code-1
    topicId: hybrid-search
    type: code
    difficulty: intermediate
    prompt: 实现 merge_candidates。关键词名单和向量名单都是已经排好序的候选，每条有 id 和 text。合并时不接收权重，也不把两路分数相加。返回的每条有 id、text 和 lanes。两路都出现的条目在前，顺序与关键词名单一致，lanes 先写 keyword 再写 vector。然后是只出现在关键词名单里的，保持原顺序，lanes 只有 keyword。最后是只出现在向量名单里的，保持原顺序，lanes 只有 vector。比较前去掉 id 和 text 的首尾空白，返回值使用去掉空白后的字符串。同一路里去掉空白后 id 重复，或去掉空白后 id 或 text 为空，抛出 ValueError。同一个 id 在两路的 text 不一致，抛出 ValueError。两路都空时返回空列表。不要修改输入列表。可以写辅助函数。
