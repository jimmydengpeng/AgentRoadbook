topicId: embedding
questions:
  - id: embedding-choice-1
    topicId: embedding
    type: choice
    difficulty: beginner
    prompt: 嵌入在 RAG 里负责什么？
    options:
      - id: a
        text: 用向量代替原文，索引里只留数字
      - id: b
        text: 页面上的手写二维向量就是嵌入模型会返回的结果
      - id: c
        text: 把文本变成向量，用来比较和问题是否接近，原文还要另外保存
      - id: d
        text: 余弦相似度越高，这句话在事实上就越正确
    answer: c
    explanation: 向量只用于比较接近程度。手写的短向量是为了心算方向，不是模型输出。分数高只说明方向接近，事实是否成立要看原文，所以原文必须和向量一起留下。
  - id: embedding-short-1
    topicId: embedding
    type: short
    difficulty: beginner
    prompt: 用自己的话说明余弦相似度在比较什么。为什么本页里 4/5 和 3/5 不能当成嵌入模型给出的相关度？
    reference: 余弦相似度比较两个向量的方向。方向相同是 1，垂直是 0，相反是 -1。本页的二维向量是手写的，轴上的名字也是临时起的，所以 4/5 和 3/5 只是公式的结果。真实嵌入的分量更多，换模型后还要重新计算，不能把这两个分数当成阈值或模型输出。
    rubric:
      - 说明比的是方向，同方向接近 1
      - 指出示例向量是手写的，不是模型输出
      - 说明真实嵌入的各维没有「包邮」「发票」这种现成名字
      - 说明高分不是事实判断，也不能当成通用阈值
