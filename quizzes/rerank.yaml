  - id: rerank-choice-1
    topicId: rerank
    type: choice
    difficulty: intermediate
    prompt: 重排和第一轮召回怎么分工？
    options:
      - id: a
        text: 重排只对第一轮已经取回的少量候选重新排序
      - id: b
        text: 重排扫描整个资料库，第一轮召回可以省掉
      - id: c
        text: 重排把第一轮的分数再乘上一个适用于任何资料的常数
      - id: d
        text: 词在原文里出现过，就可以当成任何句子的相关度
    answer: a
    explanation: 重排的输入是第一轮已经取出的候选。没进这批的片段不会被第二次比较看见。它不代替召回，也不存在一个通用的乘数。词重叠只供手算，读不懂「不包邮」和「包邮」的差别。
  - id: rerank-short-1
    topicId: rerank
    type: short
    difficulty: intermediate
    prompt: 为什么重排不能代替第一轮召回？第二次比较为什么只面对少量候选？
    reference: 重排只比较已经放进候选的片段。答案如果没进这批候选，更细的比较也看不见它。第一轮负责从库里取出可能相关的片段，重排负责把这几条重新排序。第二次比较要同时看问题和原文，通常比第一轮更贵，所以不拿去扫描整个库。留几条要看自己的问题，不能从论文实验里抄一个规模。
    rubric:
      - 说明重排的输入是第一轮的候选
      - 说明没进候选的片段不会被重排找到
      - 说明第一轮负责召回，重排负责重新排序
      - 没有把重排说成可以扫描整个库，也没有抄一个候选规模
