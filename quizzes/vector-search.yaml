questions:
  - id: vector-search-choice-1
    topicId: vector-search
    type: choice
    difficulty: beginner
    prompt: Top-K 检索应该返回什么？
    options:
      - id: a
        text: 相似度最高的 K 条，并带上原文和它在文档中的位置
      - id: b
        text: 全文按文件名排序后的前 K 个字
      - id: c
        text: 所有余弦相似度大于 0.8 的片段，而且 0.8 适用于任何资料
      - id: d
        text: 只有分数，原文可以留在索引外面
    answer: a
    explanation: Top-K 按相似度从高到低取前 K 条。结果里要有原文、文件名和段号，分数只说明这次的名次。没有一个适用于任何资料的阈值或 K。只返回分数时，模型和用户都看不到依据。
  - id: vector-search-short-1
    topicId: vector-search
    type: short
    difficulty: beginner
    prompt: 为什么相似度最高的一条仍可能和问题无关？取回结果里除了分数还要保留什么？
    reference: 最高分只是这批候选里的相对名次。候选都不够近时，第一名仍然可能无关，这时应该说明资料不足。结果里要保留原文、来源和位置，才能核对，也才能区分是检索偏了还是生成偏了。K 要看自己的问题和文档，不能从别人的实验里抄一个固定值。
    rubric:
      - 说明最高分是这批候选里的相对名次
      - 提到候选都不够近时第一名仍可能无关
      - 说明要保留原文、来源和位置
      - 没有把某个 K 或阈值说成普遍正确
